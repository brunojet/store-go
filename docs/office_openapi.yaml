openapi: 3.0.3
info:
  title: Office API
  version: 1.0.0
  description: API para consulta de categorias e tipos de categorias do Office
  contact:
    name: Bruno Jet
    email: brunojet@example.com
servers:
  - url: http://localhost:8080
tags:
  - name: Categoria
    description: Operações relacionadas a categorias
  - name: TipoCategoria
    description: Operações relacionadas a tipos de categoria
  - name: Application
    description: Operações relacionadas a aplicações (apps)
paths:
  /categorias:
    get:
      tags:
        - Categoria
      summary: Lista categorias
      description: Retorna uma lista paginada de categorias
      operationId: listCategorias
      parameters:
        - name: page
          in: query
          description: Página desejada
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Tamanho da página
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '500':
          description: Erro interno
  /tipo_categorias:
    get:
      tags:
        - TipoCategoria
      summary: Lista tipos de categoria
      description: Retorna uma lista paginada de tipos de categoria
      operationId: listTipoCategorias
      parameters:
        - name: page
          in: query
          description: Página desejada
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Tamanho da página
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de tipos de categoria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoCategoria'
        '500':
          description: Erro interno
  /apps:
    get:
      tags:
        - Application
      summary: Lista aplicações
      description: Retorna uma lista paginada de aplicações
      operationId: listApplications
      parameters:
        - name: page
          in: query
          description: Página desejada
          required: false
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          description: Tamanho da página
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de aplicações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '500':
          description: Erro interno
    post:
      tags:
        - Application
      summary: Cria uma aplicação
      operationId: createApplication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Aplicação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Requisição inválida
        '500':
          description: Erro interno
  /apps/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - Application
      summary: Retorna uma aplicação por id
      operationId: getApplicationById
      responses:
        '200':
          description: Aplicação encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Não encontrada
        '500':
          description: Erro interno
    put:
      tags:
        - Application
      summary: Atualiza uma aplicação
      operationId: updateApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '200':
          description: Aplicação atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Requisição inválida
        '404':
          description: Não encontrada
        '500':
          description: Erro interno
    delete:
      tags:
        - Application
      summary: Remove uma aplicação
      operationId: deleteApplication
      responses:
        '204':
          description: Removido com sucesso
        '404':
          description: Não encontrada
        '500':
          description: Erro interno
components:
  schemas:
    Categoria:
      type: object
      properties:
        id:
          type: integer
          format: int64
        id_tipo_categoria:
          type: integer
          format: int64
        tipo_categoria:
          $ref: '#/components/schemas/TipoCategoria'
        id_pai:
          type: integer
          format: int64
          nullable: true
          pai:
            $ref: '#/components/schemas/CategoriaPai'
            nullable: true
    TipoCategoria:
      type: object
      properties:
        id:
          type: integer
          format: int64

    CategoriaPai:
      type: object
      description: Categoria pai simplificada
      properties:
        id:
          type: integer
          format: int64
        id_tipo_categoria:
          type: integer
          format: int64
    Application:
      type: object
      properties:
        id:
          type: integer
          format: int64
        application_configurations:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationConfigurationSummary'

    ApplicationCreate:
      type: object
      properties:
        # minimal create payload; expansions possible later
        application_configurations:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationConfigurationSummary'

    ApplicationConfigurationSummary:
      type: object
      properties:
        application_id:
          type: integer
          format: int64
        integration_type_id:
          type: integer
          format: int64
        terminal_model_id:
          type: integer
          format: int64
